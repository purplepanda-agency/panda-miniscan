<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Structa — JSON-LD & llms.txt</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('structa-theme');
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topnav">
      <div class="topnav-inner">
        <a href="/" class="brand" id="brandHome" aria-label="Back to start">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>Structa</strong>
        </a>
        <div class="topnav-actions">
          <button
            type="button"
            class="theme-toggle"
            id="themeToggle"
            aria-label="Switch to light mode"
            title="Switch theme"
          >
            <svg class="theme-toggle-icon theme-toggle-icon--sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2" />
              <path
                d="M12 2v2.5M12 19.5V22M4.22 4.22l1.77 1.77M18.01 18.01l1.77 1.77M2 12h2.5M19.5 12H22M4.22 19.78l1.77-1.77M18.01 5.99l1.77-1.77"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <svg class="theme-toggle-icon theme-toggle-icon--moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 7 7 0 1 0 20.5 14.5Z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="shell">
      <section id="landing" class="landing">
        <div class="hero">
          <h1>Find structured data gaps on any site</h1>
          <p class="lede">Enter a URL to crawl JSON-LD and check for an llms.txt file.</p>

          <form id="form" class="search-bar">
            <label class="sr-only" for="url">Website URL</label>
            <input id="url" name="url" type="url" placeholder="https://example.com" required autocomplete="url" />
            <button type="submit" id="submit" class="search-btn" aria-label="Analyze">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2" />
                <path d="M20 20l-3.2-3.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
              </svg>
            </button>
          </form>
        </div>

        <section id="emptyState" class="empty-state">
          <div
            class="card empty-card"
            id="reportDropzone"
            tabindex="0"
            role="button"
            aria-label="Drop a Structa report file here, or use Open report"
          >
            <h2>Continue where you left off</h2>
            <p>Open an analysis report from a local structa file or drop it here.</p>
            <div class="empty-actions">
              <label class="ghost file-label">
                Open report
                <input id="openReportEmpty" type="file" accept="application/json,.json" hidden />
              </label>
            </div>
          </div>
        </section>
      </section>

      <section id="workspace" class="workspace" hidden>
        <p id="status" class="status" hidden></p>
        <section id="results" class="results"></section>
      </section>
    </main>

    <script src="/app.js?v=69" type="module"></script>
  </body>
</html>
