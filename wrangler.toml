name = "panda-miniscan"
main = "src/worker.js"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]

# CPU limits require Workers Paid. Free plan defaults to 10ms (or 30s with waitUntil).
# Uncomment when on a paid plan for long crawls + AI + PDF:
# [limits]
# cpu_ms = 300000

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# API always hits the Worker; everything else prefers static assets.
run_worker_first = ["/api/*"]

# Non-secret defaults (override with wrangler secret / dashboard).
[vars]
AI_PROVIDER = "gemini"
GEMINI_MODEL = "gemini-3.1-flash-lite"
GEMINI_MODEL_BASIC = "gemini-3.1-flash-lite"
GEMINI_MODEL_FALLBACKS = "none"

# Secrets (set via CLI, do not commit):
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put ANTHROPIC_API_KEY   # optional, if AI_PROVIDER=claude
#   npx wrangler secret put CLAUDE_MODEL        # optional
#   npx wrangler secret put CLAUDE_MODEL_BASIC  # optional

[observability]
enabled = true
